[project]
name = "investing-agent"
version = "0.1.0"
description = "Paper-trading stock screener and backtester for NSE (technicals first, fundamentals pluggable)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["investing_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
